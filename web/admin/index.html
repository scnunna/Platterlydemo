<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Platterly Leads</title>
<meta name="theme-color" content="#0E4D4A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Platterly operator console. Teal top bar with role and client switcher, tab row, content cards and tables.
   Each client's brand colour appears only as its chip and card edge. Same tokens as the Platterly app. */
:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --surface-2: #E9EEEB; --ink: #13201F; --muted: #56645F; --line: #D3DBD6;
  --teal: #0E4D4A; --teal-ink: #FFFFFF; --saffron: #E89A2C; --saffron-ink: #2B1A02;
  --good: #23784A; --warn: #A86A06; --bad: #B3261E; --brand: #522171;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0E1615; --surface: #162120; --surface-2: #1E2C2A; --ink: #E6EEEB; --muted: #9AACA6; --line: #2C3D3A;
  --teal: #5FC2B8; --teal-ink: #0B2321; --saffron: #F2B65A; --good: #6FCB92; --warn: #E3B35A; --bad: #F28B82; --brand: #B98BD6; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15.5px; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { background: var(--teal); color: var(--teal-ink); position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; gap: 12px; align-items: center; padding-block: 10px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
.mark svg { width: 28px; height: 28px; }
.pill { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,0.16); }
.spacer { flex: 1; }
.top select { border: 0; border-radius: 9px; padding: 6px 10px; background: rgba(255,255,255,0.16); color: inherit; font-weight: 700; }
.top select option { color: #13201F; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
.btn.accent { background: var(--saffron); color: var(--saffron-ink); border-color: var(--saffron); }
.btn.ghost-light { background: transparent; color: var(--teal-ink); border-color: rgba(255,255,255,0.4); }
.btn[disabled] { opacity: 0.55; cursor: default; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 12px 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; border-radius: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -3px 0 var(--saffron); }
main { display: grid; gap: 16px; padding-block: 12px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kpi b { display: block; font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.kpi span { color: var(--muted); font-size: 13px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--teal); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 1em; }
.ok { color: var(--good); font-size: 13.5px; font-weight: 700; }
.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.brand { background: var(--brand); color: #fff; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 760px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td code { font-family: var(--mono); font-weight: 700; font-size: 13px; }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13.5px; }
.bars .t { height: 10px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.bars .t i { display: block; height: 100%; background: var(--teal); border-radius: 10px; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 90px; border-bottom: 1px solid var(--line); padding-top: 6px; }
.spark i { flex: 1; background: var(--teal); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.spark i.today { background: var(--saffron); }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); display: grid; gap: 6px; }
/* sign in */
.signin { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.art { background: var(--teal); color: var(--teal-ink); padding: 40px; display: grid; align-content: space-between; gap: 28px; }
.art h1 { font-size: clamp(28px, 4vw, 44px); max-width: 15ch; }
.art p { max-width: 44ch; opacity: 0.9; }
.doors { display: grid; gap: 8px; }
.doors button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.doors button[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
.doors b { font-size: 15px; } .doors small { color: var(--muted); font-size: 12.5px; }
.form-side { display: grid; align-content: center; justify-items: center; padding: 32px 16px; }
.form-side > div { width: 100%; max-width: 400px; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col > header { display: grid; gap: 2px; padding: 2px 4px 4px; }
.col > header b { font-family: var(--display); font-size: 14.5px; } .col > header small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.col .n { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ccard { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--teal)); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.ccard[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--saffron); }
.ccard .t { font-weight: 800; line-height: 1.25; }
.segs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.segs i { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
.segs i b { display: block; height: 100%; background: var(--good); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; display: grid; gap: 6px; }
.step.done { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.step.done .st { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--good) 70%, transparent); }
.step label.check { align-items: flex-start; font-weight: 700; font-size: 14px; line-height: 1.3; }
.step .d { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.step .note { font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
.step .fact { font-size: 12px; font-weight: 700; color: var(--teal); }
.step textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; color: inherit; resize: vertical; min-height: 56px; }
.notebtn { justify-self: start; background: none; border: 0; padding: 0; color: var(--teal); font-weight: 700; font-size: 12px; text-decoration: underline; }
.own { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.own.client { background: color-mix(in srgb, var(--saffron) 22%, transparent); color: var(--warn); }
.own.both { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
@media (max-width: 820px) { .signin { grid-template-columns: minmax(0, 1fr); } .art { padding: 24px 18px; } .art .hide-sm { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + Number(n || 0).toFixed(2);
  const day = iso => iso ? new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : '';
  const when = iso => iso ? new Date(iso).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const SOURCE = s => { const m = /^tv-(\d)$/.exec(s || ''); return m ? `TV page ${m[1]}` : s === 'tv-direct' ? 'Direct link' : (s || 'Unknown'); };
  const MARK = `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20 L20 6 A14 14 0 0 1 32.1 27 Z" fill="#E89A2C"/><path d="M20 20 L32.1 27 A14 14 0 0 1 7.9 27 Z" fill="currentColor" opacity="0.85"/><path d="M20 20 L7.9 27 A14 14 0 0 1 20 6 Z" fill="currentColor" opacity="0.5"/></svg>`;
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

  /* The store system address is published by the store laptop into the Panago page's api.json. */
  let API = null;
  const apiReady = fetch('../panago/api.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => { API = j.leadApi || null; }).catch(() => {});
  const ss = { get: k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  let me = ss.get('platterly-staff');
  /* Stores and coupon prefixes come with sign-in (one entry per client this person may see). */
  const allStores = () => (me && me.clients || []).flatMap(c => (c.stores || []).map(st => Object.assign({ client: c.id }, st)));
  const storeName = id => (allStores().find(st => st.id === id) || {}).name || id;
  async function call(path, body, auth = true) {
    await apiReady;
    if (!API) throw new Error('The store system is offline (the store laptop is off or its tunnel is down).');
    let r;
    try { r = await fetch(API + path, { method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, auth && me ? { authorization: 'Bearer ' + me.token } : {}), body: JSON.stringify(body || {}), signal: AbortSignal.timeout(12000) }); }
    catch { throw new Error('Could not reach the store system. Check the store laptop is on, then try again.'); }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && auth) { me = null; ss.set('platterly-staff', null); render(); throw new Error(j.error || 'Signed out.'); }
    if (!r.ok) throw new Error((j.error || 'Something went wrong.') + (j.hint ? ' ' + j.hint : ''));
    return j;
  }

  /* ------------ sign in: three doors ------------ */
  let door = 'staff';
  function signin(msg) {
    app.innerHTML = `<div class="signin">
      <section class="art"><div class="mark" style="color:#fff">${MARK}platterly</div>
        <div style="display:grid;gap:12px"><h1>Every scan, every sign-up, in one place.</h1>
        <p class="hide-sm">Leads from the Spin &amp; Win QR codes, their prizes and redemptions, catering requests, and who said yes to deals.</p></div>
        <p class="tiny hide-sm" style="opacity:.75">Data lives on the store laptop. This page shows it only after you sign in.</p></section>
      <section class="form-side"><div>
        <h2>Sign in</h2>
        <div class="doors" role="group" aria-label="Who are you">
          <button type="button" data-door="staff" aria-pressed="${door === 'staff'}"><b>Super admin or client admin</b><small>Platterly team, or a store owner such as Panago or Wetzel's</small></button>
          <button type="button" data-door="customer" aria-pressed="${door === 'customer'}"><b>Customer</b><small>See your prizes with the email or mobile you used and any code you got</small></button>
        </div>
        ${door === 'staff' ? `<form id="f-staff" class="card" style="display:grid;gap:12px" novalidate>
          <div class="field"><label for="s-email">Email</label><input id="s-email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="s-pass">Password</label><input id="s-pass" type="password" autocomplete="current-password" required></div>
          <div class="err" id="s-err" role="alert">${esc(msg || '')}</div>
          <button class="btn primary" type="submit">Sign in</button></form>`
        : `<form id="f-cust" class="card" style="display:grid;gap:12px" novalidate>
          <div class="field"><label for="c-contact">Email or mobile</label><input id="c-contact" autocomplete="email"></div>
          <div class="field"><label for="c-code">Any prize code you received</label><input id="c-code" placeholder="PG-XXXXXX or WP-XXXXXX" autocapitalize="characters"></div>
          <div class="err" id="c-err" role="alert"></div>
          <button class="btn primary" type="submit">Show my prizes</button><div id="c-out"></div></form>`}
        <p class="tiny muted">No account? Store owners get one from the Platterly team. Customers: spin for a prize at <a href="../panago/">Panago</a> or <a href="../wetzels/">Wetzel's</a>.</p>
      </div></section></div>`;
  }

  /* ------------ console ------------ */
  let tab = 'overview', client = null, cache = {};
  const TABS = [['overview', 'Overview'], ['leads', 'Leads'], ['redeem', 'Redeem a code'], ['catering', 'Catering'], ['onboarding', 'Onboarding', true], ['account', 'Account']];
  function shell(body) {
    const supa = me.role === 'super_admin';
    app.innerHTML = `<header class="top"><div class="wrap">
        <div class="mark">${MARK}platterly</div><span class="pill">${supa ? 'Super admin' : 'Client admin'}</span>
        ${supa ? `<select id="client" aria-label="Client"><option value="">All clients</option>${me.clients.map(c => `<option value="${esc(c.id)}" ${c.id === client ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`
          : `<span class="badge brand">${esc((me.clients[0] || {}).name || '')}</span>`}
        <span class="spacer"></span><span class="small">${esc(me.name)}</span>
        <button class="btn ghost-light" type="button" data-act="out">Sign out</button></div></header>
      <div class="wrap"><nav class="tabs" role="tablist">${TABS.filter(t => !t[2] || supa).map(([k, l]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join('')}</nav>
      <main id="main">${body}</main></div>`;
  }
  const kpi = (v, l) => `<div class="card kpi"><b class="num">${v}</b><span>${l}</span></div>`;
  function bars(obj, label = k => k) {
    const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]); if (!e.length) return '<p class="muted small">Nothing yet.</p>';
    const max = e[0][1];
    return `<div class="bars">${e.map(([k, v]) => `<div class="b"><span>${esc(label(k))}</span><span class="t"><i style="width:${v / max * 100}%"></i></span><b class="num">${v}</b></div>`).join('')}</div>`;
  }
  async function vOverview() {
    const s = await call('/v1/staff/summary', { client }); cache.summary = s;
    const pct = s.leads ? Math.round(s.consent / s.leads * 100) : 0;
    const today = new Date().toLocaleDateString('en-CA');
    const days = []; for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toLocaleDateString('en-CA'); days.push([d, (s.daily.find(x => x.day === d) || {}).leads || 0]); }
    const dmax = Math.max(1, ...days.map(d => d[1]));
    return `<div class="row between"><h1>Overview</h1><button class="btn" type="button" data-act="refresh">Refresh</button></div>
      <div class="grid">${kpi(s.leads, 'Leads')}${kpi(s.leads_today, 'New today')}${kpi(s.leads_7d, 'Last 7 days')}${kpi(pct + '%', 'Said yes to deals')}${kpi(s.returning, 'Came back to spin again')}${kpi(s.redeemed + ' / ' + s.spins, 'Prizes redeemed')}${kpi(s.catering_new, 'New catering requests')}</div>
      <section class="card" style="display:grid;gap:10px"><div class="row between"><h2>New leads per day</h2><span class="small muted">Last 30 days · today in orange</span></div>
        <div class="spark" role="img" aria-label="Leads per day, last 30 days">${days.map(([d, n]) => `<i class="${d === today ? 'today' : ''}" style="height:${n / dmax * 100}%" title="${d}: ${n}"></i>`).join('')}</div>
        <div class="row between tiny muted"><span>${day(days[0][0] + 'T12:00')}</span><span>Peak ${dmax} a day</span><span>Today</span></div></section>
      <div class="two"><section class="card" style="display:grid;gap:10px"><h2>Spins by store</h2>${bars(s.by_store, k => k === 'unknown' ? 'Not tagged' : storeName(k))}</section>
        <section class="card" style="display:grid;gap:10px"><h2>Which screen got the scan</h2>${bars(s.by_source, SOURCE)}</section>
        <section class="card" style="display:grid;gap:10px"><h2>Prizes won</h2>${bars(s.by_prize)}</section></div>`;
  }
  let q = { search: '', consent: false };
  async function vLeads() {
    const rows = await call('/v1/staff/leads', { client, search: q.search, consent_only: q.consent, limit: 1000 }); cache.leads = rows;
    return `<div class="row between"><h1>Leads <span class="muted small num">${rows.length}</span></h1>
        <div class="row"><button class="btn" type="button" data-act="csv">Download consented contacts (CSV)</button></div></div>
      <form id="f-search" class="row" novalidate><div class="field" style="flex:1;min-width:200px"><label for="l-q">Search name, email or phone</label><input id="l-q" value="${esc(q.search)}"></div>
        <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="l-consent" ${q.consent ? 'checked' : ''}> Said yes to deals only</label>
        <button class="btn primary" type="submit" style="align-self:end">Search</button></form>
      ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Deals</th><th>First seen</th><th>Store · screen</th><th>Visits</th><th>Last prize</th><th>Code</th><th>Redeemed</th><th>Catering</th>${me.role === 'super_admin' && !client ? '<th>Client</th>' : ''}</tr></thead><tbody>
        ${rows.map(r => `<tr><td><b>${esc(r.first_name)}</b></td><td class="small">${esc(r.contact)}</td><td>${r.consent ? '<span class="badge good">Yes</span>' : '<span class="badge">No</span>'}</td>
          <td class="small num">${day(r.created_at)}</td><td class="small">${esc(r.first_store ? storeName(r.first_store) : '—')} · ${esc(SOURCE(r.first_source))}</td><td class="num">${r.spins}</td>
          <td class="small">${esc(r.last_prize || '')}</td><td><code>${esc(r.last_code || '')}</code></td><td class="num small">${r.redeemed}${Number(r.redeemed_total) ? ' · ' + money(r.redeemed_total) : ''}</td>
          <td>${r.catering ? `<span class="badge warn">${r.catering}</span>` : ''}</td>${me.role === 'super_admin' && !client ? `<td class="small">${esc(r.client_id)}</td>` : ''}</tr>`).join('')}
      </tbody></table></div><p class="tiny muted">Only contacts marked Yes may receive marketing messages (CASL). The CSV holds only those.</p>`
      : `<div class="empty"><b>No leads ${q.search || q.consent ? 'match this search' : 'yet'}.</b><span>Leads appear here as soon as someone spins and joins from a QR code.</span></div>`}`;
  }
  function vRedeem() {
    return `<h1>Redeem a code</h1><form id="f-redeem" class="card" style="display:grid;gap:12px;max-width:520px" novalidate>
      <p class="small muted">Check the customer's code at the counter or on a phone order. A code works once, on the day it was won.</p>
      <div class="field"><label for="r-code">Code</label><input id="r-code" placeholder="${esc((me.clients.find(c => c.id === client) || me.clients[0] || {}).code_prefix || 'PG')}-XXXXXX" autocapitalize="characters" style="font-family:var(--mono);font-size:18px;letter-spacing:.06em"></div>
      <div class="row"><div class="field" style="flex:1"><label for="r-store">Store</label><select id="r-store">${allStores().filter(st => !client || st.client === client).map(st => `<option value="${esc(st.id)}">${esc(st.name)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1"><label for="r-total">Order total before tax (optional)</label><input id="r-total" inputmode="decimal" placeholder="42.50"></div></div>
      <div class="err" id="r-err" role="alert"></div><div id="r-ok" class="ok" aria-live="polite"></div>
      <button class="btn accent" type="submit">Check and mark used</button></form>`;
  }
  async function vCatering() {
    const rows = await call('/v1/staff/catering', { client });
    const ST = ['new', 'contacted', 'quoted', 'booked', 'lost'];
    return `<h1>Catering requests</h1>${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Event date</th><th>Package</th><th>People</th><th>Name</th><th>Contact</th><th>Asked</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="num"><b>${day(r.event_date + 'T12:00')}</b></td><td>${esc(r.package)}</td><td class="num">${r.headcount || ''}</td><td>${esc(r.first_name)}</td><td class="small">${esc(r.contact)}</td><td class="small">${when(r.created_at)}</td>
        <td><select data-cat="${r.id}" aria-label="Status">${ST.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty"><b>No catering requests yet.</b><span>They arrive from the "Ordering for a team?" box on the prize screen.</span></div>'}`;
  }
  function vAccount() {
    return `<h1>Account</h1><form id="f-pass" class="card" style="display:grid;gap:12px;max-width:420px" novalidate>
      <p class="small">${esc(me.name)} · ${esc(me.email)} · ${me.role === 'super_admin' ? 'Super admin' : 'Client admin'}</p>
      <div class="field"><label for="p-old">Current password</label><input id="p-old" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="p-new">New password (12+ characters)</label><input id="p-new" type="password" autocomplete="new-password"></div>
      <div class="err" id="p-err" role="alert"></div><button class="btn primary" type="submit">Change password</button></form>`;
  }
  /* ------------ onboarding board (super admin only; the database refuses anyone else) ------------
     Columns are the seven stages of the client journey. A client card sits in the first stage that still has an open step,
     so work done out of order (built before the discovery call) fills its segments but does not move the card on. */
  let onb = { sel: null, edit: null };
  const OWN = { platterly: 'Platterly', client: 'Client', both: 'Both' };
  function journey(d, c) {
    const per = d.stages.map(sg => { const steps = d.steps.filter(t => t.stage === sg.stage); const done = steps.filter(t => (c.progress[t.id] || {}).done_at).length; return { stage: sg.stage, total: steps.length, done }; });
    const cur = per.find(p => p.done < p.total), next = d.steps.find(t => !(c.progress[t.id] || {}).done_at);
    return { per, stage: cur ? cur.stage : d.stages.length + 1, next, done: per.reduce((a, p) => a + p.done, 0), total: d.steps.length };
  }
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  function fact(t, c) {
    const f = c.facts, logins = c.admins.map(a => a.last_login_at).filter(Boolean).sort();
    if (t.id === 'client-admin') return c.admins.length ? c.admins.map(a => a.email).join(', ') : 'No client admin account yet';
    if (t.id === 'first-signin') return logins.length ? 'Last sign-in ' + when(logins.pop()) : 'Owner has not signed in yet';
    if (t.id === 'client-record') return `${plural(c.stores.length, 'store')} · ${plural(f.offers, 'prize')} · codes ${c.code_prefix}-`;
    if (t.id === 'first-lead') return plural(f.leads, 'lead') + ' so far';
    if (t.id === 'test-redeem') return plural(f.redeemed, 'code') + ' redeemed';
    if (t.id === 'catering-booked') return f.catering_booked + ' booked';
    return '';
  }
  function clientCard(c, j) {
    return `<button type="button" class="ccard" data-onb-client="${esc(c.id)}" aria-pressed="${c.id === onb.sel}" style="--c:${esc(c.brand_color)}">
      <span class="t">${esc(c.name)}</span><span class="tiny muted">${esc(c.kind)} · ${j.done} of ${j.total} steps</span>
      <span class="segs" aria-hidden="true">${j.per.map(p => `<i title="Stage ${p.stage}: ${p.done}/${p.total}"><b style="width:${p.total ? p.done / p.total * 100 : 0}%"></b></i>`).join('')}</span>
      <span class="small">${j.next ? 'Next: <b>' + esc(j.next.title) + '</b>' : '<b>All steps done</b>'}</span>
      <span class="row" style="gap:6px"><span class="badge">${plural(c.facts.leads, 'lead')}</span>${c.admins.some(a => a.last_login_at) ? '<span class="badge good">Owner signed in</span>' : '<span class="badge warn">Owner not signed in</span>'}</span></button>`;
  }
  function stepCard(t, c) {
    const pr = c.progress[t.id] || {}, ok = !!pr.done_at, fx = fact(t, c);
    return `<article class="step ${ok ? 'done' : ''}"><label class="check"><input type="checkbox" data-onb-step="${esc(t.id)}" ${ok ? 'checked' : ''}><span class="st">${esc(t.title)}</span></label>
      <div class="row" style="gap:6px"><span class="own ${t.owner}">${OWN[t.owner]}</span>${ok ? `<span class="tiny muted">${esc(pr.done_by || '')} · ${day(pr.done_at)}</span>` : ''}</div>
      <div class="d">${esc(t.detail)}</div>${fx ? `<div class="fact">${esc(fx)}</div>` : ''}
      ${onb.edit === t.id ? `<form class="f-note" data-step="${esc(t.id)}" style="display:grid;gap:6px" novalidate><textarea maxlength="500" aria-label="Note for ${esc(t.title)}">${esc(pr.note || '')}</textarea><div class="row"><button class="btn primary" type="submit">Save note</button><button class="btn" type="button" data-act="note-cancel">Cancel</button></div></form>`
        : `${pr.note ? `<div class="note">${esc(pr.note)}</div>` : ''}<button type="button" class="notebtn" data-onb-note="${esc(t.id)}">${pr.note ? 'Edit note' : 'Add note'}</button>`}</article>`;
  }
  async function vOnboarding() {
    const d = await call('/v1/staff/onboarding', {}); cache.onb = d;
    if (!onb.sel || !d.clients.some(c => c.id === onb.sel)) onb.sel = (d.clients[0] || {}).id || null;
    const last = d.stages.length, J = Object.fromEntries(d.clients.map(c => [c.id, journey(d, c)]));
    const live = d.clients.filter(c => J[c.id].stage > last).length;
    const pipeline = `<div class="board" aria-label="Clients by stage">${d.stages.map(sg => {
      const here = d.clients.filter(c => Math.min(J[c.id].stage, last) === sg.stage);
      return `<section class="col"><header><span class="n">Stage ${sg.stage} · ${here.length}</span><b>${esc(sg.title)}</b><small>${esc(sg.goal)}</small></header>
        ${here.map(c => clientCard(c, J[c.id])).join('') || '<p class="tiny muted" style="padding:0 4px">No clients here.</p>'}</section>`; }).join('')}</div>`;
    const c = d.clients.find(x => x.id === onb.sel);
    let detail = '';
    if (c) {
      const j = J[c.id];
      detail = `<section class="card" style="display:grid;gap:12px;border-top:6px solid ${esc(c.brand_color)}">
        <div class="row between"><div style="display:grid;gap:2px;min-width:0"><h2>${esc(c.name)}: journey checklist</h2>
          <span class="small muted">${c.stores.map(st => esc(st.name) + (st.address ? ' · ' + esc(st.address) : '')).join(' | ')}</span></div>
          <span class="badge ${j.stage > last ? 'good' : 'warn'}">${j.stage > last ? 'Live and growing' : 'Stage ' + j.stage + ': ' + esc(d.stages[j.stage - 1].title)}</span></div>
        <div class="legend"><span>${j.done} of ${j.total} steps done.</span><span>Who does it:</span><span class="own">Platterly</span><span class="own client">Client</span><span class="own both">Both</span><span>Tick a step only when it has really happened; use notes for what is left.</span></div>
        <div class="board">${d.stages.map(sg => { const p = j.per[sg.stage - 1];
          return `<section class="col"><header><span class="n">Stage ${sg.stage} · ${p.done}/${p.total}</span><b>${esc(sg.title)}</b></header>
          ${d.steps.filter(t => t.stage === sg.stage).map(t => stepCard(t, c)).join('')}</section>`; }).join('')}</div></section>`;
    }
    return `<div class="row between"><div style="display:grid;gap:2px"><h1>Client onboarding</h1><span class="small muted">Platterly super admin only · ${plural(d.clients.length, 'client')}, ${live} live</span></div><button class="btn" type="button" data-act="refresh">Refresh</button></div>
      <section style="display:grid;gap:8px"><h2>Pipeline</h2><p class="small muted">Pick a client to open its checklist.</p>${pipeline}</section>${detail}`;
  }
  const VIEWS = { onboarding: vOnboarding, overview: vOverview, leads: vLeads, redeem: vRedeem, catering: vCatering, account: vAccount };
  async function render() {
    if (!me) return signin();
    shell('<p class="muted">Loading…</p>');
    try { document.getElementById('main').innerHTML = await VIEWS[tab](); }
    catch (e) { const m = document.getElementById('main'); if (m) m.innerHTML = `<div class="empty"><b>Could not load this page.</b><span>${esc(e.message)}</span><button class="btn" type="button" data-act="refresh">Try again</button></div>`; }
  }

  app.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.door) { door = b.dataset.door; return signin(); }
    if (b.dataset.tab) { tab = b.dataset.tab; return render(); }
    if (b.dataset.act === 'refresh') return render();
    if (b.dataset.onbClient) { onb.sel = b.dataset.onbClient; onb.edit = null; return render(); }
    if (b.dataset.onbNote) { onb.edit = b.dataset.onbNote; return render(); }
    if (b.dataset.act === 'note-cancel') { onb.edit = null; return render(); }
    if (b.dataset.act === 'out') { try { await call('/v1/staff/logout', {}); } catch {} me = null; ss.set('platterly-staff', null); return signin(); }
    if (b.dataset.act === 'csv') {
      const rows = (await call('/v1/staff/leads', { client, consent_only: true, limit: 2000 }));
      const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const csv = ['first_name,contact,contact_kind,first_seen,store,screen,visits,last_prize,client'].concat(rows.map(r => [r.first_name, r.contact, r.contact_kind, r.created_at, r.first_store, SOURCE(r.first_source), r.spins, r.last_prize, r.client_id].map(cell).join(','))).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `platterly-consented-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
      toast(`${rows.length} consented contacts downloaded.`);
    }
  });
  app.addEventListener('change', async e => {
    if (e.target.id === 'client') { client = e.target.value || null; return render(); }
    if (e.target.dataset.onbStep) {
      const box = e.target; box.disabled = true;
      try { const r = await call('/v1/staff/onboarding-set', { client: onb.sel, step: box.dataset.onbStep, done: box.checked }); if (!r.ok) toast(r.msg); return render(); }
      catch (x) { toast(x.message); box.checked = !box.checked; box.disabled = false; return; }
    }
    if (e.target.dataset.cat) { try { const r = await call('/v1/staff/catering-status', { id: e.target.dataset.cat, status: e.target.value }); toast(r.ok ? 'Status saved.' : r.msg); } catch (x) { toast(x.message); } }
  });
  app.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, v = id => (document.getElementById(id) || {}).value || '';
    if (f.id === 'f-staff') {
      const err = document.getElementById('s-err'); const email = v('s-email').trim(), pass = v('s-pass');
      if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
      err.textContent = 'Signing in…';
      try { const r = await call('/v1/staff/login', { email, password: pass }, false); me = r; ss.set('platterly-staff', r); tab = 'overview'; client = null; render(); }
      catch (x) { err.textContent = x.message; }
    }
    if (f.id === 'f-cust') {
      const err = document.getElementById('c-err'), out = document.getElementById('c-out'); err.textContent = ''; out.innerHTML = '';
      try {
        const r = await call('/v1/me', { p_client: null, p_contact: v('c-contact'), p_code: v('c-code') }, false);
        if (!r.ok) { err.textContent = r.msg; return; }
        out.innerHTML = `<h3 style="margin-top:6px">Hi ${esc(r.name)}, your prizes</h3><div style="display:grid;gap:8px;margin-top:8px">${r.spins.map(s => `<div class="card" style="padding:10px 12px"><div class="row between"><b>${esc(s.prize)}</b>${s.redeemed ? '<span class="badge">Used</span>' : new Date(s.expires_at) < new Date() ? '<span class="badge">Expired</span>' : '<span class="badge good">Valid today</span>'}</div><div class="small muted">${esc(s.rule)} · ${day(s.day + 'T12:00')} · <code>${esc(s.code)}</code></div></div>`).join('')}</div>`;
      } catch (x) { err.textContent = x.message; }
    }
    if (f.classList.contains('f-note')) {
      try { const r = await call('/v1/staff/onboarding-set', { client: onb.sel, step: f.dataset.step, note: f.querySelector('textarea').value }); if (!r.ok) { toast(r.msg); return; } onb.edit = null; toast('Note saved.'); return render(); }
      catch (x) { toast(x.message); return; }
    }
    if (f.id === 'f-search') { q = { search: v('l-q').trim(), consent: document.getElementById('l-consent').checked }; return render(); }
    if (f.id === 'f-redeem') {
      const err = document.getElementById('r-err'), ok = document.getElementById('r-ok'); err.textContent = ''; ok.textContent = '';
      const code = v('r-code').trim(); if (!/^[A-Z]{2}-[A-Z2-9]{6}$/i.test(code)) { err.textContent = 'Codes look like PG-7KQ2MD or WP-7KQ2MD.'; return; }
      try { const r = await call('/v1/staff/redeem', { code, store: v('r-store'), total: v('r-total') }); if (r.ok) { ok.textContent = `Valid. ${r.name}: ${r.prize}, ${r.rule}. Marked used.`; document.getElementById('r-code').value = ''; } else err.textContent = r.msg; }
      catch (x) { err.textContent = x.message; }
    }
    if (f.id === 'f-pass') {
      const err = document.getElementById('p-err');
      try { const r = await call('/v1/staff/password', { old: v('p-old'), new: v('p-new') }); if (r.ok) { err.textContent = ''; toast('Password changed.'); f.reset(); } else err.textContent = r.msg; }
      catch (x) { err.textContent = x.message; }
    }
  });
  render();
})();
</script>
</body>
</html>
