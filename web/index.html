<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Platterly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E4D4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/platterly-icon-192.png">
<meta name="description" content="Catering for your team at menu price. Order from local franchise kitchens with one honest total.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">

<style>
/* Layout: app shell. Top bar with the Platterly mark, a role-aware nav (side rail on wide screens, bottom bar on phones), and a content column of cards and tables. Client brands (Panago purple) appear only inside their own store pages. */
:root {
  --bg: #F3F5F2;
  --surface: #FFFFFF;
  --surface-2: #E9EEEB;
  --ink: #13201F;
  --muted: #56645F;
  --line: #D3DBD6;
  --teal: #0E4D4A;
  --teal-ink: #FFFFFF;
  --saffron: #E89A2C;
  --saffron-ink: #2B1A02;
  --good: #23784A;
  --warn: #A86A06;
  --bad: #B3261E;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1615; --surface: #162120; --surface-2: #1E2C2A; --ink: #E6EEEB; --muted: #9AACA6; --line: #2C3D3A;
  --teal: #5FC2B8; --teal-ink: #0B2321; --saffron: #F2B65A; --saffron-ink: #2B1A02; --good: #6FCB92; --warn: #E3B35A; --bad: #F28B82; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1615; --surface: #162120; --surface-2: #1E2C2A; --ink: #E6EEEB; --muted: #9AACA6; --line: #2C3D3A;
  --teal: #5FC2B8; --teal-ink: #0B2321; --saffron: #F2B65A; --saffron-ink: #2B1A02; --good: #6FCB92; --warn: #E3B35A; --bad: #F28B82; color-scheme: dark; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.12; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: 28px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16.5px; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--teal); }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.mark svg { width: 30px; height: 30px; flex: none; }
.mark b { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; }
.role-pill { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.top .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who span { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--teal); color: var(--teal-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { display: grid; gap: 4px; align-content: start; position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); text-align: left; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--saffron); }
.nav button .badge { margin-left: auto; }
main { min-width: 0; display: grid; gap: 18px; align-content: start; }
.demo-bar { background: var(--saffron); color: var(--saffron-ink); font-size: 13px; font-weight: 600; }
.demo-bar .top-in { padding-block: 6px; flex-wrap: wrap; }
.demo-bar button { border: 1px solid rgba(43,26,2,0.35); background: transparent; border-radius: 8px; padding: 3px 9px; font-weight: 700; font-size: 12.5px; }

/* pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.flat { border: 0; background: var(--surface-2); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid.k { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
.btn.accent { background: var(--saffron); color: var(--saffron-ink); border-color: var(--saffron); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--teal); padding-inline: 6px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.badge.teal { background: color-mix(in srgb, var(--teal) 15%, transparent); color: var(--teal); }
.badge.saffron { background: var(--saffron); color: var(--saffron-ink); }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.field textarea { min-height: 70px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--teal); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 1em; }
.kpi { display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.kpi span { color: var(--muted); font-size: 13px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td input.price { width: 84px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.toggle { position: relative; width: 40px; height: 23px; border-radius: 99px; border: 0; background: var(--line); flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); transition: transform 160ms; }
.toggle[aria-pressed="true"] { background: var(--teal); }
.toggle[aria-pressed="true"]::after { transform: translateX(17px); }
.thumb { width: 52px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex: none; }
.empty { display: grid; gap: 8px; justify-items: start; padding: 22px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

/* login */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-art { position: relative; background: var(--teal); color: var(--teal-ink); padding: 40px; display: grid; align-content: space-between; gap: 30px; overflow: hidden; }
.login-art h1 { font-size: clamp(30px, 4vw, 48px); max-width: 14ch; }
.login-art p { max-width: 42ch; opacity: 0.9; }
.login-art .plate { position: absolute; right: -80px; bottom: -80px; width: 340px; height: 340px; opacity: 0.18; }
.login-art .facts { display: grid; gap: 8px; font-size: 14px; position: relative; }
.login-art .facts div { display: flex; gap: 10px; align-items: center; }
.login-art .facts i { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); flex: none; }
.login-form { display: grid; align-content: center; justify-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-form > div { width: 100%; max-width: 380px; display: grid; gap: 16px; }
.demo-accounts { display: grid; gap: 8px; }
.demo-accounts button { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; }
.demo-accounts button:hover { border-color: var(--teal); }
.demo-accounts b { display: block; font-size: 14.5px; }
.demo-accounts small { color: var(--muted); font-size: 12.5px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* customer */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; border-radius: 18px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.hero .copy { padding: 22px; display: grid; gap: 14px; align-content: start; }
.hero .pic { background: var(--surface-2) center / cover no-repeat; min-height: 220px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 40px; height: 42px; font-size: 20px; font-weight: 800; }
.stepper output { min-width: 70px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 20px; }
.brand-head { border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--brand, var(--teal)); color: #fff; }
.brand-head img { height: 30px; width: auto; }
.brand-head .row { gap: 6px; }
.brand-head select { border: 0; border-radius: 9px; padding: 7px 10px; background: rgba(255,255,255,0.15); color: #fff; font-weight: 700; }
.brand-head select option { color: #13201F; }
.pkg { display: grid; gap: 0; overflow: hidden; padding: 0; position: relative; }
.pkg .pic { aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2) center / cover no-repeat; }
.pkg .body { padding: 14px; display: grid; gap: 8px; }
.pkg .price { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.pkg.featured { border: 2px solid var(--saffron); }
.pkg .flag { position: absolute; top: 10px; left: 10px; }
.item { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 10px; align-items: start; }
.item img, .item .noimg { width: 88px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
.item .noimg { display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; padding: 6px; }
.item h3 { font-size: 15px; }
.item p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sizes button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 9px; font-size: 13px; font-weight: 700; }
.sizes button:hover { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 8%, transparent); }
.sizes button small { color: var(--muted); font-weight: 600; margin-left: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.cartbar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.cartbar .btn { background: var(--saffron); color: var(--saffron-ink); border-color: var(--saffron); }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; }
.totals { display: grid; gap: 5px; font-size: 14px; }
.totals div { display: flex; justify-content: space-between; gap: 10px; }
.totals .grand { font-family: var(--display); font-weight: 800; font-size: 20px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.track div { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.track div i { height: 6px; border-radius: 6px; background: var(--line); }
.track div.on { color: var(--ink); }
.track div.on i { background: var(--teal); }
.punch { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.punch span { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: var(--muted); }
.punch span.on { background: var(--saffron); border: 2px solid var(--saffron); color: var(--saffron-ink); }
.foryou { border: 2px solid var(--teal); }
.foryou .lines { margin: 4px 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.credit-big { font-family: var(--display); font-weight: 800; font-size: 38px; letter-spacing: -0.02em; line-height: 1; }
.boxes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.boxes button { aspect-ratio: 1; max-width: 100%; border: 2px solid var(--line); border-radius: 16px; background: var(--surface-2); font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--teal); transition: transform 160ms; display: grid; place-items: center; }
.boxes button:hover:not([disabled]) { transform: translateY(-3px); border-color: var(--saffron); }
.boxes button.win { background: var(--saffron); color: var(--saffron-ink); border-color: var(--saffron); transform: scale(1.05); }
.boxes button.miss { opacity: 0.55; }
.boxes button[disabled] { cursor: default; }
.paybox { display: grid; gap: 10px; }
.paymethods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.paymethods label { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13.5px; background: var(--surface); }
.paymethods label:has(input:checked) { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.paymethods input { accent-color: var(--teal); }
.cardform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.demo-pay { font-size: 12px; font-weight: 700; color: var(--warn); }
input[type=range] { width: 100%; accent-color: var(--saffron); }
@media (max-width: 520px) { .cardform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .cardform .wide { grid-column: 1 / -1; } }
.coupon { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.coupon code { font-family: var(--mono); font-weight: 800; font-size: 17px; letter-spacing: 0.06em; }

/* client admin */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 10px; align-content: start; min-width: 220px; }
.col > h3 { font-size: 14px; display: flex; justify-content: space-between; padding: 2px 4px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 7px; font-size: 13.5px; }
.ocard .id { font-family: var(--mono); font-weight: 700; font-size: 12.5px; }
.ocard .pack { display: grid; gap: 4px; padding: 8px; border-radius: 9px; background: var(--surface-2); }
.steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps-list li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.steps-list .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--surface-2); color: var(--muted); }
.steps-list li.done .dot { background: var(--good); color: #fff; }
.steps-list li.now { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.steps-list li.now .dot { background: var(--saffron); color: var(--saffron-ink); }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.25); max-width: calc(100% - 32px); }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,20,19,0.45); z-index: 40; display: grid; justify-items: end; }
.sheet { width: min(460px, 100%); height: 100%; background: var(--bg); overflow-y: auto; padding: 18px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 30; display: flex; justify-content: space-around; gap: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
  .nav button { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 8px; min-width: 62px; }
  .nav button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--saffron); background: transparent; }
  .nav button .badge { display: none; }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-art { padding: 26px 20px; }
  .login-art .facts { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero .pic { min-height: 170px; order: -1; }
  .who span { display: none; }
  .cartbar { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }

/* Platterly data layer.
   Two backends share one interface:
   - Demo: everything lives in this browser (localStorage), seeded from data.js. Used when no Supabase project is configured.
   - Supabase: sign-in by email code, and data in Postgres with row-level security (see supabase/schema.sql).
   The app only calls window.Store.*, so switching backends needs no UI changes. */
(function () {
  const SEED = window.PLATTERLY_SEED;
  const CFG = window.PLATTERLY_CONFIG || {};
  const KEY = 'platterly-demo-v2'; // v2 adds credits; older saved demos start fresh
  const money = n => Math.round(n * 100) / 100;

  function priceItem(menu, [itemId, size, qty, override]) {
    const it = menu.find(m => m.id === itemId);
    if (!it) return 0;
    const unit = override != null ? override : (size ? it.sizes[size] : it.price);
    return unit * qty;
  }
  function packageTotal(pkg, menu) { return money(pkg.items.reduce((s, line) => s + priceItem(menu, line), 0)); }
  function cartTotals(lines, store, hst, creditsUsed) {
    const food = money(lines.reduce((s, l) => s + l.unit * l.qty, 0));
    const delivery = !store || !store.deliveryFee ? 0 : food >= store.freeDeliveryOver || food === 0 ? 0 : store.deliveryFee;
    const tax = money((food + delivery) * hst);
    const total = money(food + delivery + tax);
    const credits = money(Math.min(Math.max(0, creditsUsed || 0), total));
    return { food, delivery, tax, total, credits, due: money(total - credits) };
  }

  /* What a customer usually orders, from their order history. */
  function orderProfile(orders, menu) {
    const real = orders.filter(o => o.lines && o.lines.length);
    if (!real.length) return null;
    const qty = {}, people = [], days = {}, hours = {};
    let vegSlices = 0, allSlices = 0;
    real.forEach(o => {
      people.push(o.people || 1);
      const d = new Date(o.slot); days[d.getDay()] = (days[d.getDay()] || 0) + 1; hours[d.getHours()] = (hours[d.getHours()] || 0) + 1;
      o.lines.forEach(l => {
        const k = l.itemId + '|' + (l.size || ''); qty[k] = (qty[k] || 0) + l.qty / (o.people || 1);
        const it = menu.find(m => m.id === l.itemId);
        if (it && it.cat === 'pizza') { allSlices += l.qty; if (it.tags.some(t => t === 'veg' || t === 'plant')) vegSlices += l.qty; }
      });
    });
    Object.keys(qty).forEach(k => { qty[k] /= real.length; }); // average portion per person across orders
    const top = (o) => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
    const avgPeople = Math.round(people.reduce((a, b) => a + b, 0) / people.length);
    return { orders: real.length, avgPeople, perPerson: qty, day: Number(top(days)), hour: Number(top(hours)), vegShare: allSlices ? vegSlices / allSlices : 0,
      favourites: Object.entries(qty).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k.split('|')) };
  }
  /* Their usual order, scaled to today's headcount, at today's menu prices. */
  function usualLines(profile, headcount, menu) {
    if (!profile) return [];
    return Object.entries(profile.perPerson).map(([k, perHead]) => {
      const [id, size] = k.split('|'), it = menu.find(m => m.id === id);
      if (!it || it.soldOut) return null;
      // Items this headcount would not normally get (rounds to 0) are left out, not forced to 1.
      const unit = size ? it.sizes[size] : it.price, q = Math.round(perHead * headcount);
      return q >= 1 ? { itemId: id, name: it.name + (size ? ` (${size})` : ''), size: size || null, qty: q, unit } : null;
    }).filter(Boolean);
  }
  /* One thing to try: a new item that fits how they order (vegetarian-leaning teams get a veg pick). */
  function suggestion(profile, menu, lines) {
    const have = new Set((lines || []).map(l => l.itemId));
    const pool = menu.filter(m => m.cat === 'pizza' && !m.soldOut && !have.has(m.id));
    const veg = profile && profile.vegShare >= 0.3;
    return pool.find(m => m.tags.includes('new') && (!veg || m.tags.includes('veg'))) || pool.find(m => m.tags.includes('new')) || pool[0] || null;
  }
  function pickBox(table) { const tot = table.reduce((s, x) => s + x[1], 0); let r = Math.random() * tot; for (const [v, w] of table) { r -= w; if (r < 0) return v; } return table[0][0]; }
  function packageLines(pkg, menu) {
    return pkg.items.map(([id, size, qty, override]) => {
      const it = menu.find(m => m.id === id);
      const unit = override != null ? override : (size ? it.sizes[size] : it.price);
      return { itemId: id, name: it.name + (size ? ` (${size})` : '') + (override != null ? ' · Larges for Less' : ''), size, qty, unit };
    });
  }

      const row = { id, createdAt: now, status: 'received', history: [{ status: 'received', at: now }], packing: {}, ...order }; S.orders.push(row);
      let earned = 0, chance = false;
      if (u) {
        if (used) { u.credits = money(u.credits - used); S.creditLog.push({ userId: u.id, amount: -used, why: `Paid on ${id}`, at: now }); }
        earned = money(order.totals.food * SEED.credits.earnRate); u.credits = money((u.credits || 0) + earned);

  /* ---------------- Supabase backend ----------------
     Activated when config.js sets supabaseUrl and supabaseAnonKey.
     Tables and access rules: supabase/schema.sql. Menu and packages are read from the
     database; admin edits go through the same tables, guarded by row-level security. */
  function makeSupabase() {
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    const one = async q => { const { data, error } = await q; if (error) throw new Error(error.message); return data; };
    const toUser = p => p && ({ id: p.id, name: p.name, email: p.email, phone: p.phone, role: p.role, clientId: p.client_id, company: p.company, address: p.address, headcount: p.headcount, consent: p.consent, stamps: p.stamps });
    return {
      mode: 'supabase',
      async session() { const { data } = await sb.auth.getUser(); if (!data.user) return null; return toUser(await one(sb.from('profiles').select('*').eq('id', data.user.id).single())); },
      async sendCode(contact) { const isEmail = contact.includes('@'); const { error } = await sb.auth.signInWithOtp(isEmail ? { email: contact } : { phone: contact }); if (error) throw new Error(error.message); return { sent: true }; },
      async verifyCode(contact, code, name) { const isEmail = contact.includes('@'); const { data, error } = await sb.auth.verifyOtp(isEmail ? { email: contact, token: code, type: 'email' } : { phone: contact, token: code, type: 'sms' }); if (error) throw new Error(error.message); if (name) await sb.from('profiles').update({ name }).eq('id', data.user.id); return this.session(); },
      async signInAs() { throw new Error('Demo accounts are only available in demo mode.'); },
      async signOut() { await sb.auth.signOut(); },
      async resetDemo() {},
      async clients() { return (await one(sb.from('clients').select('*').order('name'))).map(c => ({ ...c, onboardingStep: c.onboarding_step })); },
      async client(id) { const c = await one(sb.from('clients').select('*').eq('id', id).single()); return { ...c, onboardingStep: c.onboarding_step }; },
      async addClient(c) { return one(sb.from('clients').insert({ name: c.name, brand: c.brand, owner_email: c.owner, status: 'onboarding', onboarding_step: 2 }).select().single()); },
      async setStep(clientId, step) { await one(sb.from('clients').update({ onboarding_step: step, status: step >= 9 ? 'live' : 'onboarding' }).eq('id', clientId)); },
      async stores(clientId) { let q = sb.from('stores').select('*'); if (clientId) q = q.eq('client_id', clientId); return (await one(q)).map(s => ({ ...s, clientId: s.client_id, leadHours: s.lead_hours, deliveryFee: Number(s.delivery_fee), freeDeliveryOver: Number(s.free_delivery_over) })); },
      async menu(clientId) { return (await one(sb.from('menu_items').select('*').eq('client_id', clientId).order('sort'))).map(m => ({ ...m, sizes: m.sizes || undefined, price: m.price == null ? undefined : Number(m.price), soldOut: m.sold_out })); },
      async updateItem(clientId, itemId, patch) { const row = {}; if ('soldOut' in patch) row.sold_out = patch.soldOut; if ('sizes' in patch) row.sizes = patch.sizes; if ('price' in patch) row.price = patch.price; return one(sb.from('menu_items').update(row).eq('client_id', clientId).eq('id', itemId).select().single()); },
      async packages(clientId) { return (await one(sb.from('packages').select('*').eq('client_id', clientId))).map(p => ({ ...p, clientId: p.client_id })); },
      async offers() { return one(sb.from('offers').select('*')); },
      async updateOffer(id, patch) { await one(sb.from('offers').update(patch).eq('id', id)); },
      async orders(filter) { let q = sb.from('orders').select('*').order('created_at', { ascending: false }); if (filter && filter.userId) q = q.eq('user_id', filter.userId); if (filter && filter.clientId) q = q.eq('client_id', filter.clientId); return (await one(q)).map(o => ({ ...o, userId: o.user_id, storeId: o.store_id, clientId: o.client_id, packageId: o.package_id, createdAt: o.created_at })); },
      async placeOrder(o) { return one(sb.from('orders').insert({ user_id: o.userId, store_id: o.storeId, client_id: o.clientId, package_id: o.packageId, lines: o.lines, totals: o.totals, slot: o.slot, people: o.people, address: o.address, notes: o.notes, payment: o.payment, status: 'received', history: [{ status: 'received', at: new Date().toISOString() }], packing: {} }).select().single()); },
      async setStatus(orderId, status) { const o = await one(sb.from('orders').select('history').eq('id', orderId).single()); return one(sb.from('orders').update({ status, history: [...(o.history || []), { status, at: new Date().toISOString() }] }).eq('id', orderId).select().single()); },
      async setPacking(orderId, key, val) { const o = await one(sb.from('orders').select('packing').eq('id', orderId).single()); await one(sb.from('orders').update({ packing: { ...(o.packing || {}), [key]: val } }).eq('id', orderId)); },
      async setStanding(orderId, val) { await one(sb.from('orders').update({ standing: val }).eq('id', orderId)); },
      async users() { return (await one(sb.from('profiles').select('*'))).map(toUser); },
      async updateUser(id, patch) { const row = { ...patch }; if ('clientId' in row) { row.client_id = row.clientId; delete row.clientId; } const u = await one(sb.from('profiles').update(row).eq('id', id).select().single()); if ('consent' in patch) await sb.from('consents').insert({ user_id: id, text: patch.consent ? 'Deals and catering offers by email or text' : 'Withdrew consent', source: 'Account settings' }); return toUser(u); },
      async consents(userId) { let q = sb.from('consents').select('*'); if (userId) q = q.eq('user_id', userId); return (await one(q)).map(c => ({ ...c, at: c.created_at })); },
      async wallet(userId) { return (await one(sb.from('coupons').select('*, offer:offers(*)').eq('user_id', userId))); },
      async redeem(code) { const { data, error } = await sb.rpc('redeem_coupon', { p_code: code.trim().toUpperCase() }); if (error) return { ok: false, msg: error.message }; return data; },
      async settings() { const s = await one(sb.from('settings').select('*').single()); return { hst: Number(s.hst), platformFee: s.platform_fee, refundPromise: s.refund_promise }; },
      async updateSettings(p) { await one(sb.from('settings').update({ hst: p.hst, platform_fee: p.platformFee, refund_promise: p.refundPromise }).eq('id', 1)); }
    };
  }

  const useSupabase = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase;
  window.Store = Object.assign(useSupabase ? makeSupabase() : Demo, { packageTotal, packageLines, cartTotals, money, orderProfile, usualLines, suggestion });
})();

    </section>`;
  }

          <div class="body">

            <div class="price num">${$(total)}</div>
            <div class="small"><b class="num">${$(total / p.people)}</b> per person · ${esc(p.blurb)}</div>
            <button class="btn primary" type="button" data-act="addpkg" data-id="${p.id}">Choose ${esc(p.name)}</button>

      <section class="stack"><h2>Or build your own</h2>

            <p>${esc(it.desc)}</p>${it.deal ? `<p class="small" style="color:var(--teal);font-weight:700">${esc(it.deal)}</p>` : ''}
            ${it.soldOut ? '<p class="small" style="color:var(--bad);font-weight:700;margin-top:6px">Sold out today</p>' : `<div class="sizes">${it.sizes ? Object.entries(it.sizes).map(([sz, pr]) => `<button type="button" data-act="additem" data-id="${it.id}" data-size="${sz}">${sz} ${$(pr)}<small>${SEED.SLICES[sz]} sl</small></button>`).join('') : `<button type="button" data-act="additem" data-id="${it.id}">Add ${$(it.price)}<small>${esc(it.unit)}</small></button>`}</div>`}</div></article>`;
        }).join('')}</div>`).join('')}
        <p class="tiny muted">Gluten-Smart crust (medium only) is not recommended for celiac customers. Prices from the Panago Q4 2026 Ontario menu and may change.</p>

  function cartBar(stores) {
    const t = S.cartTotals(st.cart.lines, stores.find(s => s.id === st.cart.storeId), 0.13);
    const n = st.cart.lines.reduce((s, l) => s + l.qty, 0);
    return `<div class="cartbar"><div><b>${n} item${n === 1 ? '' : 's'}</b> · <span class="num">${$(t.total)}</span> <span class="small" style="opacity:.75">incl. delivery and tax</span></div><button class="btn" type="button" data-act="opencart">Review order</button></div>`;
  }
  async function cartSheet() {
    const settings = await S.settings(), stores = await S.stores(st.cart.clientId), store = stores.find(s => s.id === st.cart.storeId);
    const cr = await S.credits(st.user.id);

            <input type="range" id="c-credits" min="0" max="${Math.min(cr.balance, t.total).toFixed(2)}" step="0.01" value="${Math.min(cr.balance, t.total).toFixed(2)}" aria-label="Credits to use">

    if (a === 'soldout') { const it = (await S.menu(st.user.clientId)).find(m => m.id === d.id); await S.updateItem(st.user.clientId, d.id, { soldOut: !it.soldOut }); return render(); }
    if (a === 'step') { await S.setStep(d.client, Number(d.step)); toast('Step done.'); return render(); }
    if (a === 'newclient') { st.newClient = !st.newClient; return render(); }
    if (a === 'viewsetup') { st.setupFor = st.setupFor === d.id ? null : d.id; return render(); }
    if (a === 'todo') { toast(d.msg); return; }
  });
  /* Checkout: credits slider and payment method update the totals in place. */
  root.addEventListener('input', e => {
    if (e.target.id !== 'c-credits') return;
    const used = parseFloat(e.target.value) || 0;
    const due = Math.max(0, Math.round((parseFloat(document.getElementById('c-due').dataset.total || '0') - used) * 100) / 100);
    document.getElementById('c-cr-val').textContent = $(used); document.getElementById('c-cr-line').textContent = '−' + $(used);
    document.getElementById('c-due').textContent = $(due);
    document.getElementById('c-methods').hidden = due <= 0;
    document.getElementById('c-submit').textContent = due > 0 ? 'Place order · pay ' + $(due) : 'Place order · paid with credits';
  });
  root.addEventListener('change', async e => {
    if (e.target.name === 'pay') { const c = document.getElementById('c-card'); if (c) c.hidden = e.target.value !== 'card'; }
    const el = e.target, a = el.dataset.act;
    if (a === 'store') { st.cart.storeId = el.value; saveCart(); return render(); }
    if (a === 'pack') { await S.setPacking(el.dataset.id, el.dataset.k, el.checked); return render(); }
    if (a === 'price') { const v = parseFloat(el.value); if (!(v > 0)) { toast('Enter a price above $0.'); return render(); } const it = (await S.menu(st.user.clientId)).find(m => m.id === el.dataset.id); if (el.dataset.size) await S.updateItem(st.user.clientId, it.id, { sizes: { ...it.sizes, [el.dataset.size]: v } }); else await S.updateItem(st.user.clientId, it.id, { price: v }); toast(`${it.name} price saved.`); return; }
    if (a === 'odds') { const v = parseInt(el.value, 10); if (!(v >= 0)) return; await S.updateOffer(el.dataset.id, { odds: v }); return render(); }
  });
  root.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, v = id => (document.getElementById(id) || {}).value || '';
    if (f.id === 'f-contact') { const c = v('l-contact').trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c) && c.replace(/\D/g, '').length < 10) { document.getElementById('l-err').textContent = 'Enter an email address or a 10-digit mobile number.'; return; } try { await S.sendCode(c); st.login = { step: 'code', contact: c, name: '' }; render(); } catch (x) { document.getElementById('l-err').textContent = x.message; } return; }
    if (f.id === 'f-code') { try { st.user = await S.verifyCode(st.login.contact, v('l-code').trim(), v('l-name').trim()); st.view = null; render(); } catch (x) { document.getElementById('l-err').textContent = x.message; } return; }
    if (f.id === 'f-checkout') {
      const err = document.getElementById('c-err'), slot = v('c-slot'), people = parseInt(v('c-people'), 10), addr = v('c-addr').trim();
      const stores = await S.stores(st.cart.clientId), store = stores.find(s => s.id === st.cart.storeId), settings = await S.settings();
      if (!addr) { err.textContent = 'Add a delivery address, including the floor or suite.'; return; }
      if (!slot || new Date(slot) < new Date(Date.now() + 60 * 6e4)) { err.textContent = 'Pick a time at least an hour from now.'; return; }
      if (people >= 25 && new Date(slot) < new Date(Date.now() + store.leadHours * 3600e3)) { err.textContent = `Orders for 25+ people need ${store.leadHours} hours' notice. Pick a later time or call ${'310-0001'}.`; return; }
      const crEl = document.getElementById('c-credits');
      const totals = S.cartTotals(st.cart.lines, store, settings.hst, crEl ? parseFloat(crEl.value) || 0 : 0);
      const method = totals.due > 0 ? (f.querySelector('input[name="pay"]:checked') || {}).value : 'credits';
      if (method === 'card') {
        const num = v('c-num').replace(/\s/g, ''), exp = v('c-exp').trim(), cvc = v('c-cvc').trim();
        if (!/^\d{13,19}$/.test(num) || !luhn(num)) { err.textContent = 'That card number does not look right. In this demo, try 4242 4242 4242 4242.'; return; }
        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)) { err.textContent = 'Enter the expiry as MM/YY.'; return; }
        if (!/^\d{3,4}$/.test(cvc)) { err.textContent = 'Enter the 3 or 4 digit CVC.'; return; }
      }
      const payment = { method, credits: totals.credits, due: totals.due, card: method === 'card' ? '•••• ' + v('c-num').replace(/\D/g, '').slice(-4) : null };
      let o;
      try { o = await S.placeOrder({ userId: st.user.id, storeId: store.id, clientId: st.cart.clientId, packageId: st.cart.packageId, lines: st.cart.lines, totals, slot: new Date(slot).toISOString(), people: people || 1, address: addr, notes: v('c-notes'), payment }); }
      catch (x) { err.textContent = x.message; return; }
      st.cart = { lines: [], clientId: st.cart.clientId, storeId: st.cart.storeId, packageId: null, people: 10 }; saveCart(); st.sheet = null;
      if (S.mode === 'demo') st.user = await S.session();
      st.view = 'orders'; toast(`Order ${o.id} placed. You earned ${$(o.earned || 0)} in credits${o.chance ? ' and a Pick-a-Box chance' : ''}.`); return render();
    }
    if (f.id === 'f-account') { st.user = await S.updateUser(st.user.id, { name: v('a-name'), company: v('a-company'), headcount: parseInt(v('a-head'), 10) || null, address: v('a-addr'), ...(document.getElementById('a-consent').checked !== !!st.user.consent ? { consent: document.getElementById('a-consent').checked } : {}) }); toast('Account saved.'); return render(); }
    if (f.id === 'f-redeem') { const r = await S.redeem(v('r-code')); toast(r.ok ? `Valid: ${r.offer.name}, ${r.offer.rule}. Marked used.` : r.msg); return; }
    if (f.id === 'f-client') { const name = v('n-name').trim(), brand = v('n-brand').trim(), owner = v('n-owner').trim(); if (!name || !brand || !/@/.test(owner)) { document.getElementById('n-err').textContent = 'Fill in the business name, brand and a valid email.'; return; } await S.addClient({ name, brand, owner }); st.newClient = false; toast(`${brand} created. Invite ready for ${owner}.`); return render(); }
    if (f.id === 'f-settings') { await S.updateSettings({ hst: (parseFloat(v('s-hst')) || 13) / 100, platformFee: v('s-fee'), refundPromise: v('s-promise') }); toast('Settings saved.'); return render(); }
  });

  (async () => { st.user = await S.session(); render(); })();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();

</script>
